<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Requests - YourAppName Admin</title>
<style>
  body {
    background: #0b0b0b;
    color: #fff;
    font-family: "Poppins", sans-serif;
    padding: 30px;
    text-align: center;
  }
  h2 {
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff66;
    margin-bottom: 20px;
  }
  table {
    width: 90%;
    margin: 0 auto;
    border-collapse: collapse;
    background: #111827;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 15px #00ffff33;
  }
  th, td {
    padding: 12px;
    border-bottom: 1px solid #222;
  }
  th {
    background: #00ffff22;
    color: #00ffff;
  }
  tr:hover {
    background: #1f2937;
  }
  button {
    border: none;
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .approve {
    background: #00ff99;
    color: #000;
  }
  .reject {
    background: #ff5555;
    color: #fff;
  }
  .logout {
    position: fixed;
    top: 20px;
    right: 30px;
    background: #ff5555;
    color: #fff;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
  }
  .logout:hover {
    background: #ff7777;
  }
</style>
</head>
<body>

<button class="logout" onclick="logout()">Logout</button>
<h2>?? Pending Withdraw Requests</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>User ID</th>
      <th>Amount ($)</th>
      <th>Status</th>
      <th>Requested At</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr><td colspan="6">Loading...</td></tr>
  </tbody>
</table>

<script>
async function loadWithdrawals() {
  try {
    const res = await fetch("https://admin.yourdomain.com/api/withdrawals");
    const data = await res.json();
    const body = document.getElementById("tableBody");
    body.innerHTML = "";

    if (!data || data.length === 0) {
      body.innerHTML = "<tr><td colspan='6'>No Withdrawals Found</td></tr>";
      return;
    }

    data.forEach(w => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${w.id}</td>
        <td>${w.user_id}</td>
        <td>$${parseFloat(w.amount).toFixed(2)}</td>
        <td>${w.status}</td>
        <td>${new Date(w.requested_at).toLocaleString()}</td>
        <td>
          ${w.status === 'pending' ? `
            <button class="approve" onclick="updateStatus(${w.id}, 'paid')">Approve</button>
            <button class="reject" onclick="updateStatus(${w.id}, 'rejected')">Reject</button>
          ` : ''}
        </td>
      `;
      body.appendChild(row);
    });

  } catch (err) {
    console.error("Error loading withdrawals:", err);
    document.getElementById("tableBody").innerHTML = "<tr><td colspan='6'>Error loading data</td></tr>";
  }
}

async function updateStatus(id, status) {
console.log("Sending update:", id, status);
  try {
    const res = await fetch("https://admin.yourdomain.com/api/update_withdraw", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status })
    });
    const data = await res.json();
    alert(data.message || "Status updated!");
    loadWithdrawals();
  } catch (err) {
    alert("? Failed to update status. Check console.");
    console.error(err);
  }
}

loadWithdrawals();
</script>
</body>
</html>
