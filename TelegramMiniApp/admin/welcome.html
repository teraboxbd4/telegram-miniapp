<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Admin - YourAppName</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #00111a, #000);
      color: cyan;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 40px;
      text-shadow: 0 0 20px cyan, 0 0 40px cyan;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px cyan; }
      to { text-shadow: 0 0 30px cyan, 0 0 60px cyan; }
    }

    .loader {
      margin-top: 20px;
      width: 80px;
      height: 80px;
      border: 6px solid rgba(0, 255, 255, 0.2);
      border-top-color: cyan;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome Admin 🚀</h1>
    <div class="loader"></div>
  </div>

  <script>
    // Redirect after animation
    setTimeout(() => {
      window.location.href = "user-search.html"; // or withdraw-panel.html
    }, 2500);
  </script>
</body>
</html>
