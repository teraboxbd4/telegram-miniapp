<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
if(!localStorage.getItem('admin')){
  window.location.href='login.html';
}
</script>
<script>
function logout(){
  localStorage.removeItem('admin');
  window.location.href = 'login.html';
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Search - YourAppName</title>
<style>
  body {
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
  }
  input {
    padding:10px;
    border:none;
    border-radius:5px;
    background:#1f2937;
    color:#fff;
  }
  button {
    background:#00ffff;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    color:#000;
    font-weight:bold;
  }
  table {
    width:90%;
    margin:20px auto;
    border-collapse:collapse;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
  }
  th,td {
    padding:10px;
    border-bottom:1px solid #222;
  }
  th {background:#00ffff22;}
/* 🌟 Top Bar Design */
.topbar {
  background: linear-gradient(90deg, #00111a, #002b36, #00111a);
  color: cyan;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 25px;
  border-bottom: 2px solid cyan;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 0 15px #00ffff55;
  animation: glowBar 3s infinite alternate;
}

@keyframes glowBar {
  from { box-shadow: 0 0 10px cyan; }
  to { box-shadow: 0 0 30px cyan, 0 0 60px cyan; }
}

.topbar h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
  text-shadow: 0 0 10px cyan;
}

.datetime {
  font-size: 15px;
  color: #00ffffcc;
  font-weight: bold;
}

/* Dashboard Cards */
.cards {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}
.card {
  background: linear-gradient(135deg, #00111a, #0a9396);
  color: white;
  border-radius: 12px;
  padding: 20px;
  width: 180px;
  text-align: center;
  box-shadow: 0 0 15px rgba(0,255,255,0.3);
  animation: glowPulse 3s infinite alternate;
}
.card h3 {
  margin-bottom: 10px;
  font-size: 16px;
  color: #00ffff;
}
.number {
  font-size: 28px;
  font-weight: bold;
  color: #fff;
}
@keyframes glowPulse {
  0% { box-shadow: 0 0 10px #0ff; }
  100% { box-shadow: 0 0 20px #0ff; }
}


</style>
</head>
<body>
<!-- 🌟 Animated Top Bar -->
<div class="topbar">
  <h2>💰 YourAppName Admin Panel</h2>
<div id="notifBell" style="position:relative;cursor:pointer;">
  🔔
  <span id="notifCount" style="position:absolute;top:-8px;right:-5px;
    background:red;color:white;border-radius:50%;padding:3px 6px;font-size:12px;">0</span>
</div>

  <div class="datetime" id="datetime"></div>
</div>

<div class="cards">
  <div class="card">
    <h3>👥 Total Users</h3>
    <span class="number" id="totalUsers">0</span>
  </div>
  <div class="card">
    <h3>💰 Total Paid</h3>
    <span class="number" id="totalPaid">0</span>
  </div>
  <div class="card">
    <h3>🕓 Pending</h3>
    <span class="number" id="pending">0</span>
  </div>
  <div class="card">
    <h3>❌ Rejected</h3>
    <span class="number" id="rejected">0</span>
  </div>
</div>

<div class="chart-container" style="width:90%;max-width:800px;margin:40px auto;">
  <h3 style="text-align:center;color:#00ffff;">📊 Withdraw History (Last 7 Days)</h3>
  <canvas id="withdrawChart"></canvas>
</div>


<h2>🔍 Search User Details</h2>
<input type="text" id="telegram_id" placeholder="Enter Telegram ID (e.g. tg001)">
<button onclick="searchUser()">Search</button>
<select id="statusFilter" onchange="filterTable()" 
style="margin-left:10px;padding:6px;border-radius:5px;">
  <option value="all">Show All</option>
  <option value="paid">Paid Only</option>
  <option value="pending">Pending Only</option>
</select>

<div id="result"></div>
<script>
async function searchUser() {
  const id = document.getElementById('telegram_id').value.trim();
  if (!id) return alert("Enter Telegram ID");

  // 🟢 Fetch user info
  const res = await fetch(`https://admin.yourdomain.com/api/user/${id}`);
  const data = await res.json();

  if (data.error || !data.name) {
    document.getElementById('result').innerHTML = `<p style="color:red;">User not found!</p>`;
    return;
  }

  // 🟢 Show user info
  document.getElementById('result').innerHTML = `
    <h3>User Info</h3>
    <table>
      <tr><th>Telegram ID</th><td>${id}</td></tr>
      <tr><th>Name</th><td>${data.name}</td></tr>
      <tr><th>Points</th><td>${data.points}</td></tr>
      <tr><th>Balance</th><td>$${data.balance}</td></tr>
    </table>
    <h3>Withdrawal History</h3>
    <table id="withdrawTable">
      <tr><th>ID</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr>
    </table>
    <div id="summary" style="color:#00ffcc; text-align:center; margin-top:15px; font-weight:bold;"></div>
  `;

  // 🟢 Fetch withdrawal data
  const res2 = await fetch(`https://admin.yourdomain.com/api/withdraw_history/${id}`);
  const historyData = await res2.json();

  const table = document.getElementById('withdrawTable');
  const history = historyData.history || [];

  if (history.length === 0) {
    table.innerHTML += `<tr><td colspan="4">No withdrawals</td></tr>`;
  } else {
    history.forEach(w => {
  let actionBtn = "";
  if (w.status === "pending") {
    actionBtn = `<button onclick="markAsPaid(${w.id})" 
      style="background:#00ffcc;color:#000;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;">
      Mark Paid
    </button>`;
  } else {
    actionBtn = `<span style="color:#0f0;">✔ Paid</span>`;
  }

  table.innerHTML += `
    <tr>
      <td>${w.id}</td>
      <td>${w.amount}</td>
     <td style="color:${w.status==='paid' ? '#00ff00' : '#ffcc00'};font-weight:bold;">
  ${w.status}
</td>
      <td>${w.requested_at}</td>
      <td>${actionBtn}</td>
    </tr>`;
});

  }

  // 🟢 Show summary (only if available)
  if (historyData.summary) {
    document.getElementById('summary').innerHTML = `
      <p><b>Total Paid:</b> $${historyData.summary.total_paid}</p>
      <p><b>Pending Withdrawals:</b> $${historyData.summary.total_pending}</p>
    `;
  }
}
async function markAsPaid(id) {
  if (!confirm("Are you sure you want to mark this as paid?")) return;

  const res = await fetch("https://admin.yourdomain.com/api/mark_paid", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id })
  });

  const data = await res.json();
  if (data.success) {
    alert("✅ Withdrawal marked as paid!");
    searchUser(); // refresh page
  } else {
    alert("❌ Error: " + data.error);
  }
}
function filterTable() {
  const filter = document.getElementById("statusFilter").value.toLowerCase();
  const rows = document.querySelectorAll("#withdrawTable tr");
  
  rows.forEach((row, index) => {
    if (index === 0) return; // header skip
    const statusCell = row.cells[2].textContent.toLowerCase();
    if (filter === "all" || statusCell === filter) {
      row.style.display = "";
    } else {
      row.style.display = "none";
    }
  });
}

</script>
<script>
function updateTime() {
  const now = new Date();
  const options = {
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  };
  document.getElementById("datetime").textContent =
    now.toLocaleString('en-US', options);
}

setInterval(updateTime, 1000);
updateTime();
</script>
<script>
// Function to animate numbers
function animateNumber(id, target) {
  let count = 0;
  const speed = target / 50;
  const element = document.getElementById(id);
  const interval = setInterval(() => {
    count += speed;
    if (count >= target) {
      count = target;
      clearInterval(interval);
    }
    element.textContent = Math.floor(count);
  }, 30);
}

// ✅ Load real data from backend
async function loadStats() {
  try {
    const res = await fetch("https://admin.yourdomain.com/api/dashboard_stats");
    const data = await res.json();

    animateNumber("totalUsers", data.total_users);
    animateNumber("totalPaid", data.total_paid);
    animateNumber("pending", data.total_pending);
    animateNumber("rejected", data.total_rejected);
  } catch (err) {
    console.error("Error loading stats:", err);
  }
}

loadStats();
setInterval(loadStats, 20000); // Auto refresh every 20 sec
</script>

<script>
async function loadWithdrawChart() {
  try {
    const res = await fetch("https://admin.yourdomain.com/api/withdraw_history");
    const data = await res.json();

    const ctx = document.getElementById("withdrawChart").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: data.dates,
        datasets: [
          {
            label: "Paid Withdraws",
            data: data.paid,
            borderColor: "#00ffcc",
            backgroundColor: "rgba(0,255,204,0.2)",
            fill: true,
          },
          {
            label: "Pending Withdraws",
            data: data.pending,
            borderColor: "#ffcc00",
            backgroundColor: "rgba(255,204,0,0.2)",
            fill: true,
          }
        ],
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true },
        },
      },
    });
  } catch (err) {
    console.error("Chart load error:", err);
  }
}

loadWithdrawChart();
</script>

<script>
async function loadNotifications() {
  try {
    const res = await fetch("https://admin.yourdomain.com/api/notifications");
    const data = await res.json();
    document.getElementById("notifCount").textContent = data.filter(n => n.is_read === 0).length;

    if (data.length > 0) {
      let latest = data[0];
     showPopup("🔔 " + latest.message);
// ? mark all notifications as read
await fetch("https://admin.yourdomain.com/api/mark_read", { method: "POST" });

    }
  } catch (err) {
    console.error("Notification error:", err);
  }
}

// Browser popup + sound
function showNotification(message) {
  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.play();
  if (Notification.permission === "granted") {
    new Notification("💰 YourAppName Admin Alert", { body: message });
  }
}

// Ask notification permission once
// Ask for notification permission automatically if not granted
if (Notification.permission !== "granted") {
  Notification.requestPermission().then(permission => {
    if (permission === "granted") {
      console.log("Notification access granted ✅");
    } else {
      console.log("Notification blocked ❌");
    }
  });
}


// Auto refresh notifications every 30 sec
setInterval(loadNotifications, 30000);
loadNotifications();
</script>

<script>
function showPopup(message) {
  // agar pehle se popup hai to hata do
  const oldPopup = document.getElementById("popupMessage");
  if (oldPopup) oldPopup.remove();

  // naya popup div banao
  const popup = document.createElement("div");
  popup.id = "popupMessage";
  popup.innerHTML = message;
  popup.style.position = "fixed";
  popup.style.bottom = "20px";
  popup.style.right = "20px";
  popup.style.background = "linear-gradient(135deg, #00ffaa, #0077ff)";
  popup.style.color = "#000";
  popup.style.padding = "15px 20px";
  popup.style.borderRadius = "10px";
  popup.style.boxShadow = "0 0 15px rgba(0,255,255,0.8)";
  popup.style.fontWeight = "bold";
  popup.style.zIndex = "9999";
  popup.style.animation = "fadeInOut 5s ease forwards";

  document.body.appendChild(popup);

  // popup 5s baad gayab
  setTimeout(() => {
    popup.remove();
  }, 5000);
}

// smooth fade animation
const style = document.createElement("style");
style.textContent = `
@keyframes fadeInOut {
  0% { opacity: 0; transform: translateY(20px); }
  10% { opacity: 1; transform: translateY(0); }
  90% { opacity: 1; }
  100% { opacity: 0; transform: translateY(20px); }
}`;
document.head.appendChild(style);
</script>



</body>
</html>
