<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourAppName User Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 60px auto;
      background: #111827;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    h2 { color: cyan; }
    p span {
      font-weight: bold;
      color: #00ff9d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>YourAppName User Dashboard</h2>
    <p>Telegram ID: <span id="telegram_id"></span></p>
    <p>Name: <span id="name"></span></p>
    <p>Points: <span id="points"></span></p>
    <p>Balance ($): <span id="balance"></span></p>
  </div>

  <script>
    async function loadUser() {
      const res = await fetch('http://72.60.208.21:4000/api/user/tg001');
      const data = await res.json();

      document.getElementById('telegram_id').innerText = data.telegram_id;
      document.getElementById('name').innerText = data.name;
      document.getElementById('points').innerText = data.points;
      document.getElementById('balance').innerText = data.balance;
    }
    loadUser();
  </script>
</body>
</html>
