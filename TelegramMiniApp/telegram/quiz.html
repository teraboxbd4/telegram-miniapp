<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YourAppName Quizzes</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src='//libtl.com/sdk.js' data-zone='10051927' data-sdk='show_10051927'></script>

    <style>
        :root {
            --bg: #05080e;
            --glass: rgba(20, 25, 35, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #00f2ff; /* Cyan */
            --gold: #ffd700;    /* Gold */
            --success: #00ff9d;
            --danger: #ff4757;
            --btn-grad: linear-gradient(90deg, #ffd700, #ffaa00);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(106, 0, 255, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === Header === */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .header-title { 
            font-size: 1.6rem; font-weight: 800; 
            background: linear-gradient(90deg, #fff, #a0a0a0); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .back-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            border-radius: 12px; width: 42px; height: 42px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; color: #fff; transition: 0.2s; font-size: 20px;
        }
        .back-btn:active { transform: scale(0.9); }

        /* === Banner Ad Slot Design (Premium Borders) === */
        .ad-banner-slot {
            width: 100%;
            min-height: 60px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0 20px 0;
            overflow: hidden;
            color: #555;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* === Quiz List (Card Design) === */
        .quiz-container { display: grid; gap: 18px; animation: fadeIn 0.5s ease; }

        .quiz-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px 15px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .quiz-card:active { transform: scale(0.98); }

        .q-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin: 0 0 8px 0; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .q-meta-badge {
            display: inline-flex; align-items: center; gap: 12px;
            background: rgba(0, 242, 255, 0.08); border: 1px solid rgba(0, 242, 255, 0.15);
            padding: 6px 16px; border-radius: 20px;
            font-size: 0.85rem; color: var(--primary); font-weight: 500;
            margin-bottom: 20px;
        }
        .q-meta-badge i { font-size: 16px; }

        .q-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 5px; }
        .q-pts { font-size: 0.95rem; font-weight: 700; color: var(--gold); display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
        .q-usd { font-size: 0.95rem; font-weight: 700; color: var(--success); display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
        .q-pts span, .q-usd span { font-size: 0.7rem; color: #888; font-weight: 400; margin-top: 2px; }

        .start-btn {
            background: var(--btn-grad); border: none; color: #000; padding: 10px 28px;
            border-radius: 30px; font-size: 1rem; font-weight: 800; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); position: relative; overflow: hidden; transition: 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }
        .start-btn::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent); animation: shine 2.5s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

        /* === Play Area === */
        #playArea { display: none; animation: slideUp 0.4s ease; }
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        .question-box {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 24px; padding: 25px; text-align: center; backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .q-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }

        .option-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 16px; border-radius: 16px; color: #ddd; font-size: 1rem;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; width: 100%;
            font-weight: 500;
        }
        .option-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        .option-btn.correct { background: rgba(0, 255, 157, 0.15); border-color: var(--success); color: var(--success); font-weight: 700; }
        .option-btn.wrong { background: rgba(255, 71, 87, 0.15); border-color: var(--danger); color: var(--danger); }

        /* === Result Screen === */
        #resultScreen { display: none; text-align: center; padding: 20px; animation: fadeIn 0.5s; }
        .result-icon-box {
            width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center; font-size: 50px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5); border: 4px solid;
            background: rgba(255,255,255,0.05);
        }
        .win-mode { border-color: var(--success); color: var(--success); box-shadow: 0 0 30px rgba(0,255,157,0.3); }
        .lose-mode { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 30px rgba(255,71,87,0.3); }

        .result-title { font-size: 2rem; font-weight: 800; margin: 10px 0; }
        .cash-earned { font-size: 2.2rem; font-weight: 800; color: #fff; margin: 5px 0; text-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }

        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; margin: 30px auto 0; }
        .action-btn { padding: 16px; border-radius: 16px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; width: 100%; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255, 71, 87, 0.3); }

        /* === Utilities === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .shimmer { position: relative; overflow: hidden; background: rgba(255,255,255,0.05); border-radius: 20px; height: 160px; margin-bottom: 18px; }
        .shimmer::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shim 1.5s infinite; }
        @keyframes shim { 100% { left: 100%; } }

        .load-more-btn { background: transparent; border: 1px solid var(--border); color: #888; padding: 15px; width: 100%; border-radius: 15px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="back-btn" onclick="window.location.href='dashboard.html'">
            <i class="ph-bold ph-arrow-left"></i>
        </div>
        <div class="header-title">Quiz Arena</div>
        <div style="width:40px;"></div>
    </header>

    <div id="quizTopBanner" class="ad-banner-slot">
        <span>Advertisement</span>
    </div>

    <div id="listScreen" class="quiz-container">
        <div class="shimmer"></div>
        <div class="shimmer"></div>
    </div>
    
    <button id="loadMoreBtn" class="load-more-btn" style="display:none;" onclick="loadMoreQuizzes()">Load More Quizzes</button>

    <div id="quizBottomBanner" class="ad-banner-slot">
        <span>Advertisement</span>
    </div>

    <div id="playArea">
        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="question-box">
            <div style="margin-bottom:20px; color:#888; font-size:0.9rem; font-weight: 500;">
                Question <span id="qCurrent" style="color:#fff;">1</span> <span style="opacity:0.5">/</span> <span id="qTotal">8</span>
            </div>
            <div class="q-text" id="qText">Loading Question...</div>
            <div id="optionsGrid"></div>
        </div>
    </div>

    <div id="resultScreen"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Init Telegram
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg && tg.expand) {
            tg.expand();
        }

        let user = tg?.initDataUnsafe?.user || { id: localStorage.getItem("yourapp_user_id") || 0000000000 };
        let allQuizzes = [], currentQuiz = null, qIndex = 1, score = 0, displayCount = 5;

        // ? NEW: ONLINE TRACKER (HEARTBEAT) ?
        function sendHeartbeat() {
            if(user && user.id) {
                fetch("https://yourdomain.com/api/heartbeat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ telegram_id: user.id })
                }).catch(e => console.log("Heartbeat error"));
            }
        }
        sendHeartbeat(); // Page load hote hi ping
        setInterval(sendHeartbeat, 45000); // Phir har 45 sec baad ping

        // ? MONETAG 1-MINUTE AUTO AD (IN-APP INTERSTITIAL) ?
        setTimeout(() => {
            if (typeof show_10051927 === 'function') {
                show_10051927({
                    type: 'inApp',
                    inAppSettings: {
                        frequency: 999,
                        capping: 0,
                        interval: 60, // Har 60 seconds (1 minute) baad ad aayega
                        timeout: 5,
                        everyPage: false
                    }
                }).catch(e => console.log("Auto Ad Setup Error:", e));
            }
        }, 3000); // Wait 3 seconds for SDK to load completely

        // --- 1. Fetch Quiz List ---
        async function loadQuizList() {
            const listScreen = document.getElementById("listScreen");
            try {
                const res = await fetch(`https://yourdomain.com/api/quizzes/${user.id}`);
                const data = await res.json();
                listScreen.innerHTML = "";

                if (!data.success || !data.quizzes?.length) {
                    listScreen.innerHTML = `<div style="text-align:center; padding:40px; color:#666;">No unplayed quizzes right now.</div>`;
                    return;
                }
                allQuizzes = data.quizzes;
                renderList();
            } catch (err) {
                listScreen.innerHTML = `<div style="text-align:center; padding: 20px; color:var(--danger);">Error loading Arena.</div>`;
            }
        }

        function renderList() {
            const listScreen = document.getElementById("listScreen");
            const btn = document.getElementById("loadMoreBtn");
            const visible = allQuizzes.slice(0, displayCount);
            
            listScreen.innerHTML = "";
            
            visible.forEach((q, index) => {
                const usdValue = (q.total_points / 1000).toFixed(2);

                const card = document.createElement("div");
                card.className = "quiz-card";
                card.onclick = () => tryStartQuiz(q.id, q.title);

                card.innerHTML = `
                    <div class="q-title">${q.title}</div>
                    <div class="q-meta-badge">
                        <i class="ph-bold ph-question"></i> 8 Qs | <i class="ph-bold ph-clock"></i> 2 Mins
                    </div>
                    <div class="q-footer">
                        <div class="q-pts">+${q.total_points}<span>POINTS</span></div>
                        <button class="start-btn">START</button>
                        <div class="q-usd">$${usdValue}<span>USD</span></div>
                    </div>
                `;
                listScreen.appendChild(card);

                if ((index + 1) % 2 === 0 && (index + 1) !== visible.length) {
                    const adSlot = document.createElement("div");
                    adSlot.className = "ad-banner-slot";
                    adSlot.innerHTML = `<span>Advertisement</span>`;
                    listScreen.appendChild(adSlot);
                }
            });

            btn.style.display = allQuizzes.length > displayCount ? "block" : "none";
        }

        function loadMoreQuizzes() { displayCount += 5; renderList(); }

        // --- 2. Start Game Logic (Rewarded Ad) ---
        function tryStartQuiz(id, title) {
            if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            // ? MONETAG REWARDED AD ON START ?
            if (typeof show_10051927 === 'function') {
                show_10051927('pop').then(() => {
                    fetchQuizData(id); // Ad dekhne ke baad game start hoga
                }).catch((e) => {
                    fetchQuizData(id); // Agar ad fail hua toh bhi game start ho jayega
                });
            } else {
                fetchQuizData(id);
            }
        }

        async function fetchQuizData(id) {
            // Hide list elements
            document.getElementById("listScreen").style.display = "none";
            document.getElementById("loadMoreBtn").style.display = "none";
            document.getElementById("mainHeader").style.display = "none";
            document.getElementById("quizTopBanner").style.display = "none"; 
            document.getElementById("quizBottomBanner").style.display = "none"; 
            
            document.getElementById("playArea").style.display = "block";
            document.getElementById("qText").innerText = "Wait, Loading...";
            
            try {
                const res = await fetch(`https://yourdomain.com/api/quiz/${id}`);
                const data = await res.json();
                if(data.success && data.quiz) {
                    currentQuiz = data.quiz;
                    qIndex = 1; score = 0;
                    renderQuestion();
                } else { location.reload(); }
            } catch(e) { location.reload(); }
        }

        // --- 3. Rendering Questions (Rewarded Ads on Q2, Q4, Q7) ---
        function renderQuestion() {
            const qData = currentQuiz[`question${qIndex}`];
            if(!qData) { finishQuiz(); return; }

            // ? MONETAG REWARDED AD ON Q2, Q4, and Q7 ?
            if (qIndex === 2 || qIndex === 4 || qIndex === 7) {
                if (typeof show_10051927 === 'function') {
                    show_10051927('pop').catch(e => console.log("In-Game Ad Error:", e));
                }
            }

            document.getElementById("qCurrent").innerText = qIndex;
            document.getElementById("qText").innerText = qData;
            document.getElementById("progressBar").style.width = `${((qIndex - 1) / 8) * 100}%`;

            const optsContainer = document.getElementById("optionsGrid");
            optsContainer.innerHTML = "";
            ['a', 'b', 'c', 'd'].forEach(opt => {
                const text = currentQuiz[`option${qIndex}${opt}`];
                if(text) {
                    const btn = document.createElement("div");
                    btn.className = "option-btn";
                    btn.innerHTML = `<span style="opacity:0.5; font-weight:800; width:20px;">${opt.toUpperCase()}</span> ${text}`;
                    btn.onclick = () => handleAnswer(btn, text);
                    optsContainer.appendChild(btn);
                }
            });
        }

        function handleAnswer(btn, selectedText) {
            document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = "none");
            const isCorrect = selectedText.trim().toLowerCase() === currentQuiz[`correct${qIndex}`].trim().toLowerCase();
            
            if(isCorrect) {
                btn.classList.add("correct");
                score++;
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                btn.classList.add("wrong");
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            setTimeout(() => { qIndex++; renderQuestion(); }, 1000);
        }

        // --- 4. Result Processing (Big Interstitial Ad) ---
        async function finishQuiz() {
            // ? MONETAG BIG INTERSTITIAL AD ON RESULT SCREEN ?
            if (typeof show_10051927 === 'function') {
                show_10051927().catch(e => console.log("Result Screen Ad Error:", e));
            }

            const playArea = document.getElementById("playArea");
            const resultScreen = document.getElementById("resultScreen");
            playArea.style.display = "none";
            resultScreen.style.display = "block";

            const total = 8;
            const isWin = score === total;
            const usdEarned = (currentQuiz.total_points / 1000).toFixed(3);

            let htmlContent = "";

            if (isWin) {
                if (typeof confetti === "function") {
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
                }
                
                try {
                    await fetch("https://yourdomain.com/api/add_points", {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ telegram_id: user.id, points: currentQuiz.total_points })
                    });
                    await fetch("https://yourdomain.com/api/submit_quiz", {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ telegram_id: user.id, quiz_id: currentQuiz.id, score: score })
                    });
                } catch(err) { console.log("Save error", err); }

                htmlContent = `
                    <div class="result-icon-box win-mode"><i class="ph-fill ph-check"></i></div>
                    <div class="result-title" style="color:var(--success)">Perfect Score!</div>
                    <div style="color:#aaa; margin-bottom:20px;">You earned the rewards.</div>
                    <div class="cash-earned">+$${usdEarned}</div>
                    <div style="color:var(--gold); font-weight:800; margin-bottom:40px;">+${currentQuiz.total_points} POINTS</div>
                    <div class="btn-group">
                        <button class="action-btn btn-primary" onclick="location.reload()">Next Quiz <i class="ph-bold ph-arrow-right"></i></button>
                        <button class="action-btn btn-secondary" onclick="window.location.href='dashboard.html'">Go Home</button>
                    </div>
                `;
            } else {
                // ? NEW: SEND FAIL SIGNAL TO BACKEND ?
                try {
                    fetch("https://yourdomain.com/api/fail_quiz", {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ telegram_id: user.id })
                    }).catch(e => console.log("Fail ping error"));
                } catch(err) {}

                htmlContent = `
                    <div class="result-icon-box lose-mode"><i class="ph-fill ph-smiley-sad"></i></div>
                    <div class="result-title" style="color:var(--danger)">Quiz Failed</div>
                    <div style="color:#aaa; margin-bottom:15px;">You scored ${score}/8. Need 8/8 to earn.</div>
                    <div class="btn-group">
                        <button class="action-btn btn-danger" onclick="retryQuiz()">Try Again <i class="ph-bold ph-arrow-clockwise"></i></button>
                        <button class="action-btn btn-secondary" onclick="window.location.href='dashboard.html'">Go Home</button>
                    </div>
                `;
            }
            resultScreen.innerHTML = htmlContent;
        }

        function retryQuiz() {
            qIndex = 1; score = 0;
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("playArea").style.display = "block";
            renderQuestion();
        }

        // Initialize Arena
        loadQuizList();
    </script>
</body>
</html>
